<aside class="flex flex-col items-center w-20 h-screen py-6 bg-[#111727] border-r border-[#1e293b]/30">

       routerLinkActive="text-[#00E5FF] bg-[#181F32]"
       [routerLinkActiveOptions]="{exact: true}"
       class="relative flex items-center justify-center h-11 rounded-xl text-slate-400 hover:text-white hover:bg-[#181F32]/50 transition-all group"
