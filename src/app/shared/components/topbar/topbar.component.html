<header class="flex items-center justify-between h-20 px-8 bg-[#0B101E] border-b border-[#1e293b]/30">
  <!-- Left Side: Title & Status -->
  <div class="flex items-center gap-4">
    <h1 class="text-xl font-bold text-white tracking-wide">
      Finance<span class="text-[#00E5FF]">Hub</span>
    </h1>
    <div class="hidden md:flex items-center gap-2 px-3 py-1 text-xs rounded-full bg-[#181F32] border border-[#1e293b]/50">
      <span class="w-1.5 h-1.5 rounded-full bg-[#00FF88] animate-pulse"></span>
      <span class="text-slate-400">Manual-First</span>
    </div>
  </div>

  <!-- Center: Global Month/Year Selector -->
  <div class="flex items-center gap-2 bg-[#181F32] border border-[#1e293b]/60 rounded-2xl px-3 py-1.5 shadow-inner">
    <button type="button"
            data-testid="period-prev"
            (click)="periodContext.previousMonth()"
            class="p-1.5 rounded-xl text-slate-400 hover:text-[#00E5FF] hover:bg-[#111727] transition-colors"
            title="Mês anterior">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5 8.25 12l7.5-7.5" />
      </svg>
    </button>

    <div class="min-w-[140px] text-center">
      <span data-testid="period-label" class="text-sm font-bold text-white tracking-wide">
        {{ periodContext.label() }}
      </span>
    </div>

    <button type="button"
            data-testid="period-next"
            (click)="periodContext.nextMonth()"
            class="p-1.5 rounded-xl text-slate-400 hover:text-[#00E5FF] hover:bg-[#111727] transition-colors"
            title="Próximo mês">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4">
        <path stroke-linecap="round" stroke-linejoin="round" d="m8.25 4.5 7.5 7.5-7.5 7.5" />
      </svg>
    </button>
  </div>

  <!-- Right Side: User context -->
  <div class="flex items-center gap-6">
    @if (userContext.currentUser(); as user) {
      <a routerLink="/settings" class="flex items-center gap-3 hover:opacity-90 transition-opacity" title="Configurações de Perfil">
        <div class="text-right hidden sm:block">
          <p class="text-sm font-semibold text-white leading-none">{{ user.name }}</p>
          <p class="text-xs text-slate-400 mt-1">{{ user.email }}</p>
        </div>
        <div class="flex items-center justify-center w-10 h-10 rounded-full border-2 border-[#00E5FF] bg-gradient-to-tr from-[#181F32] to-[#111727] font-semibold text-[#00E5FF] shadow-sm shadow-[#00E5FF]/10">
          {{ user.name.charAt(0).toUpperCase() }}
        </div>
      </a>
    } @else {
      <div class="flex items-center gap-2">
        <span class="w-2 h-2 rounded-full bg-yellow-500 animate-ping"></span>
        <span class="text-xs text-slate-400">Carregando usuário...</span>
      </div>
    }
  </div>
</header>
