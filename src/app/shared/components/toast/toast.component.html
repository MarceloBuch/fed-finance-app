<div class="fixed bottom-6 right-6 z-50 flex flex-col gap-3 max-w-sm w-full pointer-events-none">
  @for (toast of notificationService.toasts(); track toast.id) {
    <div class="pointer-events-auto flex items-start justify-between gap-3 px-4 py-3 rounded-2xl border shadow-xl backdrop-blur-md transition-all"
         [ngClass]="{
           'bg-emerald-950/90 border-emerald-500/40 text-emerald-200': toast.type === 'SUCCESS',
           'bg-rose-950/90 border-rose-500/40 text-rose-200': toast.type === 'ERROR',
           'bg-[#181F32]/95 border-[#00E5FF]/40 text-slate-100': toast.type === 'INFO'
         }">
      <div class="flex-1 text-xs font-medium leading-relaxed">
        {{ toast.message }}
      </div>
      <button type="button"
              data-testid="toast-dismiss"
              (click)="notificationService.dismiss(toast.id)"
              class="text-slate-400 hover:text-white transition-colors p-0.5">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
        </svg>
      </button>
    </div>
  }
</div>
