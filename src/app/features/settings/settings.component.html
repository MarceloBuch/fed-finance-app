<div class="space-y-8 animate-fade-in max-w-2xl">
  <div>
    <h2 class="text-2xl font-bold text-white tracking-wide">Configurações e Perfil</h2>
    <p class="text-sm text-slate-400 mt-1">Gerencie seus dados de perfil ativo no FinanceHub.</p>
  </div>

  <div class="p-8 bg-[#181F32] rounded-3xl border border-[#1e293b]/10 shadow-lg shadow-black/10">
    @if (userContext.currentUser(); as user) {
      <form (ngSubmit)="onSubmit()" class="space-y-6">
        <div>
          <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">ID do Usuário</label>
          <input type="text" [value]="user.id" disabled
                 class="w-full px-4 py-3 bg-[#111727]/60 border border-[#1e293b]/40 rounded-xl text-slate-500 text-xs font-mono">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Nome Completo</label>
          <input type="text" [(ngModel)]="name" name="name" required
                 class="w-full px-4 py-3 bg-[#111727] border border-[#1e293b]/40 rounded-xl text-white focus:outline-none focus:border-[#00E5FF] transition-colors text-sm">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">E-mail</label>
          <input type="email" [(ngModel)]="email" name="email" required
                 class="w-full px-4 py-3 bg-[#111727] border border-[#1e293b]/40 rounded-xl text-white focus:outline-none focus:border-[#00E5FF] transition-colors text-sm">
        </div>

        <div class="pt-2">
          <button type="submit"
                  class="px-6 py-3 bg-[#00E5FF] hover:bg-cyan-400 text-[#0B101E] text-sm font-bold rounded-xl transition-colors shadow-lg shadow-cyan-500/20">
            Salvar Alterações
          </button>
        </div>
      </form>
    } @else {
      <p class="text-sm text-slate-400">Carregando dados do usuário...</p>
    }
  </div>
</div>
